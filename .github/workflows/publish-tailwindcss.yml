name: Publish Tailwindcss

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: tailwindcss

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: ${{ startsWith(github.ref, 'refs/tags/tailwindcss@') }}
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: "14.x"
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps and build (with cache)
        uses: bahmutov/npm-install@v1
        with:
          working-directory: tailwindcss

      - name: Check version matches tag
        run: |
          expected="${GITHUB_REF#refs/tags/tailwindcss@}"
          actual="$(node -p "require('./package.json').version")"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag tailwindcss@$expected não bate com a versão $actual do package.json. Suba a versão no PR antes de criar a release."
            exit 1
          fi
        working-directory: tailwindcss

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: 'https://registry.npmjs.org'

      # Linha de manutenção: o dist-tag `latest` no npm pertence ao @loja-integrada/tailwindcss-config@2.x,
      # publicado a partir do front-library. Sem `--tag legacy` este publish o rebaixaria.
      - name: Publish to NPM
        run: npm publish --access public --tag legacy
        working-directory: tailwindcss
