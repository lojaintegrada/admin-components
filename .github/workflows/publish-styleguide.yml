name: Publish Styleguide

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: styleguide

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    if: ${{ startsWith(github.ref, 'refs/tags/styleguide@') }}
    steps:
      - uses: actions/checkout@v2
        with:
          ref: main

      - uses: actions/setup-node@v2
        with:
          node-version: "14.x"
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps and build (with cache)
        uses: bahmutov/npm-install@v1
        with:
          working-directory: styleguide

      - name: Update version
        run: yarn version --new-version "${GITHUB_REF#refs/tags/styleguide@}" --no-git-tag-version
        working-directory: styleguide

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: 'https://registry.npmjs.org'

      # Linha de manutenção: o dist-tag `latest` no npm pertence ao @loja-integrada/admin-components@1.x,
      # publicado a partir do front-library. Sem `--tag legacy` este publish o rebaixaria.
      - name: Publish to NPM
        run: npm publish --access public --tag legacy --ignore-scripts
        working-directory: styleguide

      - uses: actions/setup-node@v4
        with:
          node-version: "14.x"

      - name: Send to GitHub Pages 🔧
        run: yarn deploy-storybook --ci --source-branch=main
        working-directory: styleguide
        env:
          GH_TOKEN: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
